# 后端容器。用宿主机网络：服务只绑 127.0.0.1:3100，由宿主机 Web 服务器把 /api/ 反代过来，
# 同时可以直接连宿主机本地端口上的 MySQL。配置与密钥放在同目录的 .env（不进仓库）
services:
  api:
    build:
      context: .
      args:
        - NPM_REGISTRY=${NPM_REGISTRY:-https://registry.npmjs.org/}
    container_name: runner-api
    restart: unless-stopped
    network_mode: host
    env_file: .env
    environment:
      - TZ=Asia/Shanghai
      - HOST=127.0.0.1
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
