# 宝塔 → 网站 → run.zhonghcc.com → 设置 → 伪静态，粘贴以下内容后保存
# 站点是纯静态的单页应用，没有后端接口

# 前端路由（/pace/vdot、/aerobic 等）都回落到 index.html，由页面自己处理
location / {
    try_files $uri $uri/ /index.html;
}

# 入口页与 Service Worker 不缓存，发布后立即生效；js/css 文件名带哈希，可以长期缓存
location = /index.html {
    add_header Cache-Control "no-cache";
}
location = /sw.js {
    add_header Cache-Control "no-cache";
}
location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
}
